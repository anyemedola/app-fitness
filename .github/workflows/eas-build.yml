name: EAS Build

on:
  workflow_call:
    inputs:
      profile:
        description: "eas.json build profile (development | preview | production)"
        required: false
        type: string
        default: preview
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile (development | preview | production)"
        required: false
        type: choice
        options: [development, preview, production]
        default: preview
      platform:
        description: "Target platform"
        required: false
        type: choice
        options: [all, ios, android]
        default: all

jobs:
  build:
    name: EAS Build (${{ inputs.profile }})
    runs-on: ubuntu-latest
    # Requires an EXPO_TOKEN repo secret from https://expo.dev/accounts/[account]/settings/access-tokens
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.13.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS
        working-directory: apps/mobile
        run: eas build --platform ${{ inputs.platform || 'all' }} --profile ${{ inputs.profile }} --non-interactive --no-wait
